    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: radial-gradient(circle at center, #b91d1d 0%, #7f1d1d 100%);
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .font-festive {
            font-family: 'Ma Shan Zheng', cursive;
        }
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .gold-text {
            background: linear-gradient(90deg, #ffd700, #fff8dc, #daa520, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        /* 自定义滚动条 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.2); border-radius: 10px; }
    </style>
